# 앞단 프록시(Coolify Traefik)가 준 원래 프로토콜을 그대로 넘긴다. 없으면 이 서버의 프로토콜을 쓴다.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # BE 업로드 제한(max-request-size 21MB)에 맞춘다
    client_max_body_size 21m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # Docker 내장 DNS로 BE 이름을 요청할 때마다 찾는다.
    # BE가 다시 배포돼 주소가 바뀌어도 따라가고, BE가 없어도 nginx는 뜬다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "contractcheck-be:8080";

    # API와 소셜 로그인 경로만 BE로 넘긴다
    location ~ ^/(api|oauth2|login/oauth2)/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 파일 이름에 해시가 붙은 빌드 결과는 오래 캐시한다
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # 나머지 화면 경로는 index.html로 돌려준다(SPA 폴백). index.html은 캐시하지 않는다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}
